name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build framework provider files
        working-directory: .
        run: node scripts/build.js

      # The workbench layer — the framework's own pipeline — has its own source
      # root and its own entry point, and release.yml never runs it: nothing
      # under workbench/ ships. The test suite builds it into a temp copy on its
      # own; this step is what runs it against the real tree, stale-output prune
      # included.
      - name: Build workbench provider files
        working-directory: .
        run: node scripts/build-workbench.js

      # Plain vitest inside cli/, which runs the two projects in
      # cli/vitest.config.js: every file in parallel, then the subprocess
      # spawners serially. Root `npm test` goes through scripts/run-tests.js,
      # which is native here anyway; calling vitest directly keeps this job
      # independent of the runner.
      - name: Run tests
        run: npm test

      - name: Run package smoke test
        run: npm run test:package

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      # bats -j needs GNU parallel. It is on the runner image today; install it
      # only if that ever stops being true, rather than fail with a bats error.
      - name: Ensure GNU parallel
        run: command -v parallel || (sudo apt-get update && sudo apt-get install -y parallel)

      - name: Run script test suite (bats)
        env:
          CODEADD_TESTS_JOBS: 4
        run: npm run test:scripts

  # The board app (board/). Its server shells out to the real
  # framwork/.codeadd/scripts/backlog.sh, so the job checks out the whole tree
  # and runs from board/. The e2e suite serves the BUILT app through server.mjs
  # at three viewports, so it runs after the build.
  board:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: board/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (360, 768, 1080)
        run: npm run test:e2e
