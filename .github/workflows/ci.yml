name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Least privilege: every job here reads the checkout and runs tests, none pushes
# or opens anything, so the default token needs read access and nothing more.
permissions:
  contents: read

jobs:
  # One job: Ubuntu and Node 22.19.0. macOS and Windows queued without
  # changing the verdict this repo waits on, so they are not in the matrix.
  # Node 24 stays commented until that LTS is wanted in the gate.
  #
  # The job keeps the historical `test-scripts` id so the test that slices the
  # workflow (cli/tests/run-tests.test.js L3.2) keeps pointing at the right job.
  test-scripts:
    name: native suites (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Quoted, so YAML reads it as a version and not as a number.
        # node-version: ['24']
        node-version: ['22.19.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      # Root first: the runner and the builds are built-ins-only, but the pin
      # keeps the root tree consistent with its lock on every host.
      - name: Install root dependencies
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build framework provider files
        run: node scripts/build.js

      # The workbench layer — the framework's own pipeline — has its own source
      # root and its own entry point, and release.yml never runs it: nothing
      # under workbench/ ships. The test suite builds it into a temp copy on its
      # own; this step is what runs it against the real tree, stale-output prune
      # included.
      - name: Build workbench provider files
        run: node scripts/build-workbench.js

      # The framework/test boundary rejects Bash on every host, hosted or local.
      # Bash is shadowed and Node subprocess calls are instrumented — Git and npm use `sh`/`cmd`, and the native
      # harness spawns process.execPath with `shell: false` — so transport is
      # preserved while a fallback to Bash fails loudly instead of passing on a
      # runner that happens to ship it. `--run` prefixes PATH for the child
      # only, so the runner's own step shell is never shadowed.
      - name: Install the Bash rejector
        run: node scripts/no-bash-guard.js

      # NEGATIVE CONTROL: attempt Bash through the platform shell and require a
      # non-zero result. This is what turns "we did not use Bash" from an
      # assumption about the runner image into an assertion. A shell:false
      # negative control also verifies the Node subprocess preload on Windows.
      - name: Negative control — Bash is rejected
        run: node scripts/no-bash-guard.js --probe

      # Root `npm test` runs the cli vitest suite through scripts/run-tests.js:
      # native, on a copy of the checkout, with the copy marker global-setup
      # requires. The install, update, relocation and board-runtime proofs live
      # in that suite (install.e2e, updater, installer, migrations,
      # board-runtime, board-phase-writes).
      - name: CLI suite (npm test)
        env:
          CODEADD_TESTS_RUNNER: native
        run: node scripts/no-bash-guard.js --run "npm test"

      # The root native script suite: Node's own test runner over
      # scripts/tests/*.test.cjs, through the same isolated native runner.
      - name: Scripts suite (npm run test:scripts)
        env:
          CODEADD_TESTS_RUNNER: native
        run: node scripts/no-bash-guard.js --run "npm run test:scripts"

      # GATE: pack the CLI and execute the npm-generated bin. Proves the
      # installed/relocated runtime closure independent of the vitest run.
      - name: Package smoke test
        run: npm --prefix cli run test:package

  # The board app (board/). Its server imports the generated Node core at
  # board/runtime/, which the package's pretest/prebuild/pretest:e2e hooks
  # produce from framwork/.codeadd/scripts/ before anything runs — so this job
  # checks out the whole tree rather than a standalone closure. The e2e suite
  # serves the BUILT app through server.mjs at three viewports, so it runs
  # after the build. Web/board stay on the floor, one browser platform: the
  # native six-job matrix above is what needs the cross-platform expansion.
  board:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: board/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (360, 768, 1080)
        run: npm run test:e2e
